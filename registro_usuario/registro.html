    <main>
        <Section id="Registro">
            <div class="text-center mb-4">
                <img src="../img/logo.png" alt="Mil Sabores" class="mil_sabores">
            </div>
            <div class="container mt-5 mb-5">
                <div class="card shadow-sm w-100">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="titulo_pro">SE PARTE DE NUESTROS SABORES</h3>
                        <form>
                            <div class="row">

                                <div class="col-6 mt-3">
                                    <div class="registro-input">
                                        <label id="lblNombre">Nombre:</label>
                                        <input id="nombre" class="form-control" type="text"
                                            placeholder="Ej: Pedro Antonio">
                                    </div>
                                </div>

                                <div class="col-6 mt-3">
                                    <div class="registro-input">
                                        <label id="lblApellido">Apellido:</label>
                                        <input id="apellido" class="form-control" type="text"
                                            placeholder="Ej: Santos Quintos">
                                    </div>
                                </div>

                                <div class="col-6 mt-3">
                                    <div class="registro-input">
                                        <label id="lblEdad">Edad:</label>
                                        <input id="edad" class="form-control" type="text" placeholder="Ingrese su edad">
                                    </div>
                                </div>

                                <div class="col-6 mt-3">
                                    <div class="registro-input">
                                        <label id="lblCorreo">Correo Electronico:</label>
                                        <input id="correo" class="form-control" type="text"
                                            placeholder="Ej: AntonioQuinto@duocuc.cl">
                                    </div>
                                </div>

                                <div class="col-6 mt-3">
                                    <div class="registro-input">
                                        <label id="lblPassword">Contraseña:</label>
                                        <input id="password" class="form-control" type="text"
                                            placeholder="Ingrese su Contraseña">
                                    </div>
                                </div>

                                <div class="col-6 mt-3">
                                    <div class="registro-input">
                                        <label id="lblCfCorreo">Confirme Contraseña:</label>
                                        <input id="password" class="form-control" type="text"
                                            placeholder="Ingrese su Contraseña de nuevo">
                                    </div>
                                </div>

                                <div class="col-md-6 mt-3">
                                    <div class="registro-input">
                                        <label for="region">Region:</label>
                                        <select class="form-select" id="region">
                                            <option selected disabled>Seleccione la region...</option>
                                            <option value="rm">Metropolitana</option>
                                            <option value="ra">Araucania</option>
                                            <option value="nu">Ñuble</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="col-md-6 mt-3">
                                    <div class="registro-input">
                                        <label for="comuna">Comuna:</label>
                                        <select class="form-select" id="comuna">
                                            <option selected disabled>Seleccione la comuna...</option>
                                            <option value="linares">Linares</option>
                                            <option value="longavi">Longavi</option>
                                            <option value="concepcion">Concepcion</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="col-12 registro-btn mt-4">
                                    <button onclick="guardar()" class="btn btn-dark ">REGISTRARSE</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </Section>
