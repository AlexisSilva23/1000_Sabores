    <main class="container mt-5 mb-5">

        <div class="text-center mb-4">
            <img src="../img/logo.png" alt="Mil Sabores" style="max-width: 120px;" class="mb-3">
            <h2>PASTELERÍA MIL SABORES</h2>
        </div>

        <section>
            <div class="container mt-5 mb-5">
                <div class="card shadow-sm w-100">
                    <div class="card-body p-4 p-md-5">
                        <h2>CONTACTANOS</h2>
                        <form>
                            <div class="row">
                                <div class="mb-3">
                                    <label id="lblNombre">NOMBRE COMPLETO</label>
                                    <input id="nombrecompleto" type="text" class="form-control" maxlength="100"
                                        placeholder="Ej: Santos Quintos">
                                </div>

                                <div class="mb-3">
                                    <label id="lblCorreo">CORREO</label>
                                    <input id="correo" class="form-control" type="text" maxlength="100"
                                        placeholder="Ej: AntonioQuinto@duocuc.cl">
                                </div>

                                <div class="mb-4">
                                    <label id="lblMensaje">MENSAJE</label>
                                    <textarea id="mensaje" class="form-control" rows="4" maxlength="500"
                                        placeholder="ESCRIBA EL MENSAJE...."></textarea>
                                </div>

                                <div class="d-grid">
                                    <button onclick="enviarMensaje()" type="submit"  class="btn btn-dark btn-l">ENVIAR MENSAJE</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
